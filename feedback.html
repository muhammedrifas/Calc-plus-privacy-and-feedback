<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calc+ | Feedback & Bug Reports</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 1.5rem;
      max-width: 640px;
    }
    .header h1 {
      color: #2dd4bf;
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    .header p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .form-wrapper {
      width: 100%;
      max-width: 640px;
      background: #ffffff; /* Google Forms renders best with a neutral white container */
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    iframe {
      width: 100%;
      height: 750px;
      border: none;
      display: block;
    }
    .footer {
      margin-top: 1.5rem;
      color: #64748b;
      font-size: 0.85rem;
    }
    .footer a {
      color: #2dd4bf;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Calc+ Feedback</h1>
    <p>Report bugs, request missing calculator features, or share suggestions.</p>
  </div>

  <div class="form-wrapper">
    <!-- Replace src below with your Google Form embed URL -->
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdBuDu8Fy221HmWAct1-_ZHciClxH6fobQXBQuLcL9uI01XUw/viewform?embedded=true" width="640" height="832" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
  </div>


</body>
</html>
